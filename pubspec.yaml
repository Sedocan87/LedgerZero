name: ledger_zero
description: "LedgerZero: A Sovereign Personal Finance Application"
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: '>=3.10.1 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  # Database & Persistence
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.24
  flutter_secure_storage: ^9.2.2

  # Cloud Sync
  googleapis: ^13.2.0
  googleapis_auth: ^1.6.0
  icloud_storage: ^1.0.0

  # Natural Language Processing
  chrono_dart: ^2.0.1

  # UI & State Management
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.7

  # Utilities
  intl: ^0.20.2
  uuid: ^4.5.0
  csv: ^6.0.0
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2

  # Platform Integration
  local_auth: ^2.3.0
  package_info_plus: ^8.0.2
  device_info_plus: ^10.1.2
  path: ^1.9.1
  share_plus: ^12.0.1
  pdf: ^3.11.3

  collection: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  drift_dev: ^2.18.0
  build_runner: ^2.4.12
  flutter_lints: ^4.0.0
  mockito: ^5.4.4
  integration_test:
    sdk: flutter
  share_plus_platform_interface: ^6.1.0
  plugin_platform_interface: ^2.1.8
  path_provider_platform_interface: ^2.1.2

flutter:
  uses-material-design: true
  generate: true
