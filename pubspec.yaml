name: ledger_zero
description: "LedgerZero: local-first envelope budgeting for iOS and Android."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Font for the CupertinoIcons that Flutter's iOS-style widgets use
  # (text selection toolbar, adaptive controls). 2.x targets the unbundled
  # cupertino_ui package instead of package:flutter/cupertino.
  cupertino_icons: ^1.0.9

  # Database & Persistence
  drift: ^2.35.2
  # v10: EncryptedSharedPreferences replaced by KeyStore-wrapped AES-GCM;
  # v9 data is migrated on first access (migrateOnAlgorithmChange). Stay on
  # v10 until every install has run it once: v11 drops that migration.
  flutter_secure_storage: ^10.3.4

  # Cloud Sync
  googleapis: ^17.0.0
  googleapis_auth: ^2.3.4
  icloud_storage: ^2.2.0

  # Natural Language Processing
  chrono_dart: ^2.0.1

  # UI & State Management
  # Riverpod 3 is an app-wide migration (ROADMAP follow-up).
  flutter_riverpod: ^2.6.1
  # go_router 18 is built on the unbundled material_ui/cupertino_ui packages and
  # no longer recognises package:flutter/material's MaterialApp (pages lose the
  # Material transitions). Move to 18 together with the app's own material_ui
  # migration.
  go_router: ^17.5.0

  # Utilities
  intl: ^0.20.2
  uuid: ^4.5.0
  # csv 7+ is a rewrite with different parsing (delimiter auto-detection,
  # dynamic typing); the importers are tuned and tested against 6.x.
  csv: ^6.0.0
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2

  # Platform Integration
  package_info_plus: ^10.2.2
  device_info_plus: ^13.3.0
  path: ^1.9.1
  share_plus: ^13.3.1
  pdf: ^3.13.1

  equatable: ^3.0.0
  flutter_local_notifications: ^22.3.2
  timezone: ^0.11.2
  pointycastle: ^4.0.0
  crypto: ^3.0.7
  # google_sign_in 7 is a new API (authentication and authorization split,
  # Credential Manager on Android with a mandatory server client ID). Stay on
  # 6 until Drive sign-in can be migrated and verified on real devices.
  google_sign_in: ^6.2.1
  extension_google_sign_in_as_googleapis_auth: ^2.0.12
  synchronized: ^3.4.0
  connectivity_plus: ^7.0.0
  fuzzy: ^0.5.1
  file_picker: ^13.1.0
  archive: ^4.0.7
  url_launcher: ^6.3.2

  # SQLCipher is bundled through the sqlite3 build hook (see `hooks` below).
  sqlite3: ^3.7.1
  http: ^1.6.0 # Drive media download client

dev_dependencies:
  flutter_test:
    sdk: flutter
  drift_dev: '>=2.35.1 <2.36.0' # must match the drift runtime minor (schema tools)
  build_runner: ^2.4.12
  flutter_lints: ^6.0.0
  mockito: ^5.4.4
  integration_test:
    sdk: flutter
  cross_file: ^0.3.5 # test fakes for picked files
  share_plus_platform_interface: ^7.2.0
  plugin_platform_interface: ^2.1.8
  path_provider_platform_interface: ^2.1.2
  connectivity_plus_platform_interface: ^2.1.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    # Unicode font for PDF reports (the PDF standard fonts lack €, „ “ and –).
    - assets/fonts/Roboto-Regular.ttf
    - assets/fonts/Roboto-Bold.ttf

hooks:
  user_defines:
    sqlite3:
      # Bundle SQLCipher instead of plain SQLite so the database is encrypted at rest.
      source: sqlcipher
